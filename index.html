<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Touhou music generator</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" type="image/png" href="assets/img/icon/favicon.png" />
  <meta name="theme-color" content="#0b0d12" />
</head>
<body>
  <div class="app" id="app">
    <!-- 背景 -->
    <div class="bg" id="bg"></div>
    <div class="bg-next" id="bgNext"></div>
    <div class="bg-dim"></div>

    <!-- 舞台 -->
    <div class="stage" id="stage">
      <canvas id="viz" width="1200" height="1200" aria-label="視覺化畫布"></canvas>

      <!-- 下方曲目 + 進度條 -->
      <div class="nowplaying">
        <div id="trackTitle" class="title">—</div>
        <div class="scrub">
          <div class="time t-left"><span id="curTime">0:00</span></div>
          <div id="progressBar" class="bar-outer" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="播放進度">
            <div id="progressFill" class="bar-inner"></div>
          </div>
          <div class="time t-right"><span id="durTime">0:00</span></div>
        </div>
      </div>
    </div>

    <!-- 播放清單（左側抽屜） -->
    <div id="playlistPanel" class="playlist-panel">
      <div class="playlist-header">
        <h2>播放清單</h2>
        <button id="closePlaylist" class="btn icon" aria-label="關閉播放清單" title="關閉">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.29 9.17 12 2.88 5.71 4.29 4.29l6.3 6.31 6.3-6.31z"/>
          </svg>
        </button>
      </div>
      <ul id="playlistItems"></ul>
    </div>

    <!-- 設定（右下角小浮窗） -->
    <div id="settingsPanel" class="settings-flyout">
      <div class="settings-header">
        <h2>設定</h2>
        <button id="closeSettings" class="btn icon sm" aria-label="關閉設定" title="關閉">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.29 9.17 12 2.88 5.71 4.29 4.29l6.3 6.31 6.3-6.31z"/>
          </svg>
        </button>
      </div>

      <div class="settings-body">
        <label class="row">
          <span>同一首循環</span>
          <label class="switch">
            <input type="checkbox" id="toggleRepeatOne">
            <span class="slider"></span>
          </label>
        </label>

        <label class="row">
          <span>隨機播放</span>
          <label class="switch">
            <input type="checkbox" id="toggleShuffle">
            <span class="slider"></span>
          </label>
        </label>

        <div class="sep"></div>

        <!-- ✅ 視覺化特效開關 -->
        <label class="row">
          <span>特效（等化器）</span>
          <label class="switch">
            <input type="checkbox" id="toggleViz">
            <span class="slider"></span>
          </label>
        </label>

        <div class="sep"></div>

        <label class="row">
          <span>背景圖片（Danbooru）</span>
          <label class="switch">
            <input type="checkbox" id="toggleBg">
            <span class="slider"></span>
          </label>
        </label>

        <label class="row">
          <span class="sub">Rating</span>
          <select id="bgRating" class="input">
            <option value="safe">safe</option>
            <option value="sensitive">sensitive</option>
            <option value="questionable">questionable</option>
          </select>
        </label>

        <label class="row">
          <span class="sub">搜尋標籤</span>
          <input id="bgTag" class="input" type="text" placeholder="例如：touhou" />
        </label>

        <label class="row">
          <span class="sub">填充模式</span>
          <select id="bgFit" class="input">
            <option value="cover">cover（鋪滿，可能裁切）</option>
            <option value="contain">contain（完整顯示，可能留邊）</option>
          </select>
        </label>

        <label class="row">
          <span class="sub">自動換圖（秒）</span>
          <input id="bgInterval" class="input" type="number" min="0" step="1" placeholder="0=停用" />
        </label>

        <div class="actions">
          <button id="bgRefresh" class="btn">換一張</button>
          <button id="saveSettings" class="btn ghost">套用</button>
        </div>
      </div>
    </div>

    <!-- 底部控制列 -->
    <div class="bar">
      <div class="bar-left">
        <button class="btn icon" id="playlistBtn" title="播放清單" aria-label="播放清單">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/>
          </svg>
        </button>
      </div>

      <div class="bar-center">
        <button class="btn icon" id="prev" title="上一首" aria-label="上一首">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6h2v12H6V6zm3 6l11-6v12L9 12z"/>
          </svg>
        </button>

        <!-- Play/Pause：兩個 SVG 同時存在，用 class 切換顯示 -->
        <button class="btn icon" id="play" title="播放/暫停" aria-label="播放/暫停">
          <svg class="icon play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg class="icon pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
          </svg>
        </button>

        <button class="btn icon" id="next" title="下一首" aria-label="下一首">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 6h2v12h-2V6zM5 6l11 6-11 6V6z"/>
          </svg>
        </button>
      </div>

      <div class="bar-right">
        <!-- 下載目前背景圖（原本就 SVG，改成吃 currentColor） -->
        <button class="btn icon" id="dlBgBtn" title="下載背景圖片" aria-label="下載背景圖片">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 20h14v-2H5v2zM12 2v12l4-4h-3V2h-2v8H8l4 4z"/>
          </svg>
        </button>

        <!-- 設定 -->
        <button class="btn icon" id="settingsBtn" title="設定" aria-label="設定">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.02 7.02 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 7.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.51.4 1.06.71 1.63.94l.36 2.54c.04.24.25.42.49.42h3.8c.24 0 .45-.18.49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/>
          </svg>
        </button>

        <div class="vol">
          <!-- Mute：兩個 SVG 同時存在，用 class 切換顯示 -->
          <button id="muteBtn" class="btn icon" title="靜音/恢復" aria-label="靜音/恢復">
            <svg class="icon vol-on" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.06A4.5 4.5 0 0 0 16.5 12zm0-9.5v2.06A9 9 0 0 1 20 12a9 9 0 0 1-3.5 7.44v2.06A11 11 0 0 0 22 12 11 11 0 0 0 16.5 2.5z"/>
            </svg>
            <svg class="icon vol-off" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16.5 12a4.5 4.5 0 0 0-2.5-4.03v2.39l2.5 2.5V12zM14 16.03A4.5 4.5 0 0 0 16.5 12v-.86l-2.5 2.5v2.39zM3 10v4h4l5 5V5L7 10H3zm17.19 2.19L22 14l-1.41 1.41-2.12-2.12-2.12 2.12L14.94 14l2.12-2.12-2.12-2.12L16.35 8.35l2.12 2.12 2.12-2.12L22 9.76l-2.12 2.12z"/>
            </svg>
          </button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="1" />
        </div>
      </div>
    </div>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>

  <!-- 必須是 ES modules -->
  <script type="module" src="assets/js/player.js"></script>
  <script type="module" src="assets/js/ui.js"></script>
  <script type="module" src="assets/js/viz.js"></script>
</body>
</html>
